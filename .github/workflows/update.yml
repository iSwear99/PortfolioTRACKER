name: Aktualizace portfolia

on:
  schedule:
    - cron: '20 7 * * *'    # ~9:20 Prahy (léto) — ráno, EU otevření
    - cron: '20 18 * * *'   # ~20:20 Prahy — večer, průběh US seance
    - cron: '20 21 * * *'   # ~23:20 Prahy — po US závěru, denní uzávěrka
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stáhnout ceny a přegenerovat tracker
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: python scripts/update.py
      - name: Commit výsledku
        run: |
          git config user.name  "portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/index.html
          git diff --cached --quiet || git commit -m "auto: aktualizace cen $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
